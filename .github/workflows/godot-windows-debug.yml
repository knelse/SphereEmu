name: Godot Windows Debug

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: godot-windows-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  DOTNET_VERSION: "9.0.x"
  EXPORT_PRESET: "Windows Desktop Slim"
  EXPORT_DIR: build/windows-debug
  PACKS_DIR: build/packs
  ASSET_BUNDLES_TAG: asset-bundles

jobs:
  export-windows-debug:
    name: Export Windows Debug Slim
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Godot (.NET + templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
          cache: true

      - name: Verify toolchain
        run: |
          dotnet --version
          godot --version

      - name: Generate .NET bindings
        run: godot --headless --path . --build-solutions --quit-after 20
        continue-on-error: true

      - name: Restore and build C#
        run: |
          dotnet restore SphServer.csproj
          dotnet build SphServer.csproj --configuration Debug --no-restore

      # Editor plugins can hang/crash headless import/export on CI.
      - name: Disable editor plugins for CI export
        run: |
          $path = 'project.godot'
          $text = Get-Content -LiteralPath $path -Raw
          $updated = [regex]::Replace(
            $text,
            '(?m)^enabled=PackedStringArray\([^\)]*\)',
            'enabled=PackedStringArray()'
          )
          if ($updated -eq $text) {
            Write-Warning 'editor_plugins enabled= line not found/changed'
          }
          Set-Content -LiteralPath $path -Value $updated -NoNewline -Encoding utf8

      - name: Cache Godot import (.godot)
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('export_presets.cfg', 'Godot/Textures/**/*.import', 'Godot/Models/**/*.import', 'Godot/Terrain/**/*.import') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Publish changed heavy asset packs
        env:
          GH_TOKEN: ${{ github.token }}
          GODOT: ${{ env.GODOT }}
          GODOT4: ${{ env.GODOT4 }}
        run: |
          $godot = if ($env:GODOT4) { $env:GODOT4 } elseif ($env:GODOT) { $env:GODOT } else { 'godot' }
          Write-Host "Using Godot at: $godot"
          ./Tools/asset_packs/Publish-AssetPacks.ps1 `
            -Godot $godot `
            -PacksOutDir $env:PACKS_DIR `
            -ReleaseTag $env:ASSET_BUNDLES_TAG

      - name: Export slim debug build
        run: |
          New-Item -ItemType Directory -Force -Path $env:EXPORT_DIR | Out-Null
          $out = Join-Path $env:EXPORT_DIR "SphServer.exe"
          godot --headless --path . --export-debug "$env:EXPORT_PRESET" $out

      - name: Copy runtime_data into build
        run: ./Tools/asset_packs/Copy-RuntimeData.ps1 -ExportDir $env:EXPORT_DIR

      - name: Upload slim artifact
        uses: actions/upload-artifact@v4
        with:
          name: SphServer-windows-debug-slim-${{ github.sha }}
          path: ${{ env.EXPORT_DIR }}
          if-no-files-found: error

      - name: Prune old slim artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 20;
            const prefix = 'SphServer-windows-debug-slim-';
            // paginate already unwraps { artifacts: [...] } into an item array;
            // do not use response.data.artifacts in a map fn (that is undefined).
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const builds = artifacts
              .filter((a) => a?.name?.startsWith(prefix) && !a.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            const toDelete = builds.slice(KEEP);
            for (const artifact of toDelete) {
              core.info(`Deleting ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            core.info(
              `Slim artifacts: kept ${Math.min(builds.length, KEEP)}, deleted ${toDelete.length}`
            );
